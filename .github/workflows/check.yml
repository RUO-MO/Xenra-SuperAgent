# The gate between `dev` and `main`: typecheck and tests run on clean Linux and
# Windows machines. The built `lib/` is committed, so a git install always pulls
# fresh artifacts. A push to `dev` may be rebuilt in place; `main` is protected, so
# CI verifies that `lib/` is current instead of trying to push a commit past its
# required status checks.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          # The version pinned in package.json's `packageManager`.
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # Rebuild lib/ from the sources and commit it back on `dev`, which is not
      # protected. On `main` this is impossible: the branch requires the two
      # checks below before any push is accepted, so the job would fail after
      # doing all the work. There it verifies the committed artifacts instead.
      - name: Commit rebuilt lib/ (push to dev)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- lib/)" ]; then
            echo "lib/ is already current; nothing to commit."
            exit 0
          fi
          git add -A -- lib/
          git commit -m "chore: rebuild lib/ from sources [skip ci]"
          # Rebase over any push that landed while CI ran, keeping only our lib/ commit on top.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}
      # `git status --porcelain` rather than `git diff`: tsdown cleans lib/ and
      # may add a chunk under a new content hash, which `git diff` alone ignores.
      - name: Verify lib/ matches sources
        if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
        run: |
          if [ -z "$(git status --porcelain -- lib/)" ]; then
            echo "lib/ is current."
            exit 0
          fi
          echo "::error::lib/ is stale. Run 'pnpm build' and commit the rebuilt lib/."
          git status --short -- lib/
          exit 1

  windows:
    name: typecheck, test, build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      # The Windows runner has no POSIX `sh`/`sleep`/`tmux`, which several
      # suites spawn. Exclude only those files; everything else must pass.
      - name: Test
        run: >-
          pnpm test --exclude 'tests/service-script.spec.ts'
          --exclude 'tests/environment.spec.ts'
          --exclude 'tests/commands.spec.ts'
          --exclude 'tests/sources.spec.ts'
          --exclude 'tests/store.spec.ts'
          --exclude 'tests/prompts.spec.ts'
          --exclude 'tests/deployment.spec.ts'
          --exclude 'tests/runtime.spec.ts'
          --exclude 'tests/docs.spec.ts'
      - name: Build
        run: pnpm build
