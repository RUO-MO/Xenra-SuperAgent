# The gate between `dev` and `main`: typecheck and tests run on clean Linux and
# Windows machines. After they pass, the built `lib/` is rebuilt and committed
# back to the triggering branch, so a git install always pulls fresh artifacts
# and no developer has to remember to build before pushing.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          # The version pinned in package.json's `packageManager`.
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # Rebuild lib/ from the sources and commit it back so git installs always
      # carry the artifacts matching this commit. Skipped on PRs from forks,
      # where the token is read-only and the branch is not writable.
      - name: Commit rebuilt lib/ (push to dev/main)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- lib/; then
            echo "lib/ is already current; nothing to commit."
            exit 0
          fi
          git add lib/
          git commit -m "chore: rebuild lib/ from sources [skip ci]"
          # Rebase over any push that landed while CI ran, keeping only our lib/ commit on top.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}

  windows:
    name: typecheck, test, build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      # The Windows runner has no POSIX `sh`/`sleep`/`tmux`, which several
      # suites spawn. Exclude only those files; everything else must pass.
      - name: Test
        run: >-
          pnpm test --exclude 'tests/service-script.spec.ts'
          --exclude 'tests/environment.spec.ts'
          --exclude 'tests/commands.spec.ts'
          --exclude 'tests/sources.spec.ts'
          --exclude 'tests/store.spec.ts'
          --exclude 'tests/prompts.spec.ts'
          --exclude 'tests/deployment.spec.ts'
          --exclude 'tests/runtime.spec.ts'
          --exclude 'tests/docs.spec.ts'
      - name: Build
        run: pnpm build
