# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: xenra-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/xenra-superagent>
# The Feishu Source is on by default and stays idle until its card has a bot CLI, so nothing here is needed to use it:
# give the Feishu card that CLI in Settings → Sources. Turning it off entirely is the only reason to name the row.
# - id: xenra-superagent-feishu
#   disabled: true
