<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Xenra-SuperAgent">
  <title>Xenra-SuperAgent</title>
  <defs>
    <linearGradient id="xenra-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6df6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="xenra-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- The run of work the agent carries: one ticket leaving the queue, one session executing it, one report coming back. -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#xenra-face)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#xenra-edge)"/>
  <path d="M18 44V22l14 11 14-11v22" fill="none" stroke="#ffffff" stroke-opacity="0.95" stroke-width="4.5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="18" cy="22" r="3.6" fill="#ffffff"/>
  <circle cx="46" cy="22" r="3.6" fill="#ffffff" fill-opacity="0.72"/>
  <circle cx="32" cy="33" r="3.6" fill="#ffffff" fill-opacity="0.86"/>
</svg>
